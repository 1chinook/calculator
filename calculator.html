<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  </head>
<body>

<div class="themeContainer">
  <ul id="themes">
    <li><i class='bx  bxs-palette' id="palette"></i> </li>
    <li class="theme" id="pink"></li>
    <li class="theme"id="yellow"></li>
    <li class="theme"id="green"></li>
    <li class="theme"id="red"></li>
    <li class="theme"id="blue"></li>
    <li class="theme"id="purple"></li>
  </ul>
</div>
      <div class="calculatorContainer pinkContainer">
        <input class="screen" readonly value="341">
        <div class="buttons pinkButtons">
          <div class="rowZero">
            <button class="function pink">SCI</button>
            <button class="function pink">ON</button>
            <button class="function pink">ANS</button>
          </div>
          <div class="rowOne">
            <button class="button pink acpink">AC</button>
            <button class="button pink cepink">CE</button>
            <button class="button pink">(</button>
            <button class="button pink">)</button>
            <button class="button pink">%</button>
        </div>
          <div class="rowTwo">
            <button class="button pink">x!</button>
            <button class="button pink">7</button>
            <button class="button pink">8</button>
            <button class="button pink">9</button>
            <button class="button pink">+</button>
        </div>
          <div class="rowThree">
            <button class="button pink">sqrt</button>
            <button class="button pink">4</button>
            <button class="button pink">5</button>
            <button class="button pink">6</button>
            <button class="button pink">/</button>
        </div>
          <div class="rowFour">
            <button class="button pink">pow</button>
            <button class="button pink">1</button>
            <button class="button pink">2</button>
            <button class="button pink">3</button>
            <button class="button pink">*</button>
        </div>     
          <div class="rowFive">
            <button class="button pink">0</button>
            <button class="button pink">00</button>
            <button class="button pink">.</button>
            <button class="equal equalpink">AC</button>
        </div>     
      </div>      

    <script src="calculator.js"></script>
    <script src="theme.js"></script>
</body>
</html>
